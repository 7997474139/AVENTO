<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avento Services - Food Ordering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-28">

  <!-- Header -->
  <header class="bg-emerald-700 text-white p-4 sticky top-0 z-40 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-utensils"></i> Avento Services
        </h1>
        <p class="text-xs text-emerald-100">Railway Kodur, Tirupati Dist</p>
      </div>
      <span class="bg-emerald-800 text-xs px-2.5 py-1 rounded-full font-medium">
        <i class="fa-solid fa-circle text-emerald-400 text-[10px] mr-1"></i> Open Now
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4">
    
    <!-- Restaurant Selector Tabs (Swiggy/Zomato Style) -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <button onclick="switchRestaurant('food_palace')" id="tab-food_palace" class="p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-emerald-700 text-white shadow-md">
        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=100&auto=format&fit=crop&q=80" class="w-10 h-10 rounded-xl object-cover">
        <div class="text-left">
          <p class="text-sm leading-tight">Food Place</p>
          <span class="text-[10px] opacity-85">Railway Kodur</span>
        </div>
      </button>
      <button onclick="switchRestaurant('brindavanam')" id="tab-brindavanam" class="p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-white text-gray-700 border border-gray-200 shadow-sm">
        <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9?w=100&auto=format&fit=crop&q=80" class="w-10 h-10 rounded-xl object-cover">
        <div class="text-left">
          <p class="text-sm leading-tight">Brindavan</p>
          <span class="text-[10px] text-gray-400">Railway Kodur</span>
        </div>
      </button>
    </div>

    <!-- Category Filter Bar -->
    <div id="category-bar" class="flex gap-2 overflow-x-auto no-scrollbar mb-4 py-1">
      <!-- Dynamic Categories -->
    </div>

    <!-- Food Items Grid -->
    <div id="food-items-container" class="space-y-3">
      <!-- Dynamic Items -->
    </div>
  </main>

  <!-- Sticky Bottom Cart Bar -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-2xl hidden z-50 rounded-t-2xl">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-500 font-medium"><span id="cart-count">0</span> items added</p>
        <p class="text-xl font-extrabold text-emerald-700" id="cart-total">₹0</p>
      </div>
      <button onclick="sendOrderToWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white px-6 py-3 rounded-xl text-sm font-bold shadow-lg flex items-center gap-2">
        <i class="fa-brands fa-whatsapp text-lg"></i> Confirm & Order
      </button>
    </div>
  </div>

  <script>
    const BOT_PHONE = "919059135163";

    const menus = {
      food_palace: {
        name: "Food Place Restaurant",
        categories: [
          {
            id: "fp_soups", title: "Soups",
            items: [
              { id: "fp_s1", name: "🥗 Veg Hot & Sour Soup", price: 170, img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=300&auto=format&fit=crop&q=80" },
              { id: "fp_s3", name: "🍗 Chicken Hot & Sour Soup", price: 190, img: "https://images.unsplash.com/photo-1603105037880-880cd4edfb0d?w=300&auto=format&fit=crop&q=80" }
            ]
          },
          {
            id: "fp_nonveg_starters", title: "Non-Veg Starters",
            items: [
              { id: "fp_nvs1", name: "🍗 Chilli Chicken", price: 275, img: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=300&auto=format&fit=crop&q=80" },
              { id: "fp_nvs2", name: "🍗 Chicken 65", price: 275, img: "https://images.unsplash.com/photo-1610057099443-fde8c4d50f91?w=300&auto=format&fit=crop&q=80" },
              { id: "fp_nvs3", name: "🍗 Chicken Lollipop", price: 295, img: "https://images.unsplash.com/photo-1527477396000-e27163b481c2?w=300&auto=format&fit=crop&q=80" }
            ]
          },
          {
            id: "fp_veg_starters", title: "Veg Starters",
            items: [
              { id: "fp_vs1", name: "🥦 Gobi Manchurian", price: 209, img: "https://images.unsplash.com/photo-1645177628172-a94c1f96e6db?w=300&auto=format&fit=crop&q=80" },
              { id: "fp_vs4", name: "🧀 Paneer Manchurian", price: 249, img: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=300&auto=format&fit=crop&q=80" }
            ]
          },
          {
            id: "fp_biryani", title: "Biryanis",
            items: [
              { id: "fp_b1", name: "🍗 Chicken Dum Biryani", price: 250, img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=300&auto=format&fit=crop&q=80" },
              { id: "fp_b2", name: "🍗 Spl. Chicken Biryani", price: 300, img: "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=300&auto=format&fit=crop&q=80" },
              { id: "fp_b7", name: "🥩 Mutton Fry Biryani", price: 400, img: "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=300&auto=format&fit=crop&q=80" }
            ]
          },
          {
            id: "fp_tandoor", title: "Tandoor",
            items: [
              { id: "fp_t3", name: "🫓 Butter Naan", price: 80, img: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=300&auto=format&fit=crop&q=80" },
              { id: "fp_t11", name: "🍗 Tandoori Chicken", price: 489, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300&auto=format&fit=crop&q=80" }
            ]
          }
        ]
      },
      brindavanam: {
        name: "Brindavan Restaurant",
        categories: [
          {
            id: "br_starters", title: "Starters",
            items: [
              { id: "br_s1", name: "🍗 Special Chicken Starter", price: 290, img: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=300&auto=format&fit=crop&q=80" }
            ]
          },
          {
            id: "br_biryani", title: "Biryanis",
            items: [
              { id: "br_b1", name: "🍗 Brindavan Chicken Biryani", price: 260, img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=300&auto=format&fit=crop&q=80" }
            ]
          }
        ]
      }
    };

    let currentRestaurant = 'food_palace';
    let currentCategory = 'all';
    let cart = {};

    function switchRestaurant(resId) {
      currentRestaurant = resId;
      currentCategory = 'all';
      
      document.getElementById('tab-food_palace').className = resId === 'food_palace' 
        ? "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-emerald-700 text-white shadow-md"
        : "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-white text-gray-700 border border-gray-200 shadow-sm";
      
      document.getElementById('tab-brindavanam').className = resId === 'brindavanam' 
        ? "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-emerald-700 text-white shadow-md"
        : "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-white text-gray-700 border border-gray-200 shadow-sm";

      renderCategories();
      renderItems();
    }

    function renderCategories() {
      const bar = document.getElementById("category-bar");
      const menu = menus[currentRestaurant];
      
      let html = `<button onclick="filterCategory('all')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap ${currentCategory === 'all' ? 'bg-emerald-700 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200'}">All</button>`;
      
      menu.categories.forEach(cat => {
        const isActive = currentCategory === cat.id;
        html += `<button onclick="filterCategory('${cat.id}')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap ${isActive ? 'bg-emerald-700 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200'}">${cat.title}</button>`;
      });

      bar.innerHTML = html;
    }

    function filterCategory(catId) {
      currentCategory = catId;
      renderCategories();
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById("food-items-container");
      container.innerHTML = "";

      const menu = menus[currentRestaurant];
      let itemsList = [];

      if (currentCategory === 'all') {
        menu.categories.forEach(cat => itemsList.push(...cat.items));
      } else {
        const cat = menu.categories.find(c => c.id === currentCategory);
        if (cat) itemsList = cat.items;
      }

      itemsList.forEach(item => {
        const qty = cart[item.id] ? cart[item.id].qty : 0;
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl p-3.5 shadow-sm border border-gray-100 flex items-center justify-between gap-3";
        card.innerHTML = `
          <div class="flex items-center gap-3.5">
            <img src="${item.img}" alt="${item.name}" class="w-20 h-20 rounded-xl object-cover shadow-sm">
            <div>
              <h3 class="font-bold text-gray-800 text-sm leading-snug mb-1">${item.name}</h3>
              <p class="text-sm font-extrabold text-gray-900">₹${item.price}</p>
            </div>
          </div>
          <div class="flex items-center bg-gray-50 rounded-xl p-1 border border-gray-200">
            ${qty > 0 ? `
              <button onclick="updateQty('${item.id}', -1)" class="w-8 h-8 bg-white text-emerald-700 font-bold rounded-lg shadow-sm active:scale-95">-</button>
              <span class="w-8 text-center font-bold text-sm text-gray-800">${qty}</span>
            ` : ''}
            <button onclick="updateQty('${item.id}', 1)" class="w-8 h-8 bg-emerald-600 text-white font-bold rounded-lg shadow-sm active:scale-95">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateQty(id, change) {
      const menu = menus[currentRestaurant];
      let foundItem = null;
      menu.categories.forEach(cat => {
        const found = cat.items.find(i => i.id === id);
        if (found) foundItem = found;
      });

      if (!foundItem) return;

      if (!cart[id]) cart[id] = { name: foundItem.name, price: foundItem.price, qty: 0 };
      cart[id].qty += change;

      if (cart[id].qty <= 0) delete cart[id];

      updateCartBar();
      renderItems();
    }

    function updateCartBar() {
      let count = 0;
      let total = 0;

      Object.values(cart).forEach(item => {
        count += item.qty;
        total += item.price * item.qty;
      });

      const bar = document.getElementById("cart-bar");
      if (count > 0) {
        bar.classList.remove("hidden");
        document.getElementById("cart-count").innerText = count;
        document.getElementById("cart-total").innerText = `₹${total}`;
      } else {
        bar.classList.add("hidden");
      }
    }

    function sendOrderToWhatsApp() {
      const hotelName = menus[currentRestaurant].name;
      let text = `🍽️ *New Food Order*\n🏨 Hotel: ${hotelName} (Railway Kodur)\n\n`;
      let total = 0;
      let index = 1;

      Object.values(cart).forEach(item => {
        const itemTotal = item.price * item.qty;
        text += `${index}. *${item.name}* x ${item.qty} = ₹${itemTotal}\n`;
        total += itemTotal;
        index++;
      });

      text += `\n--------------------\n💰 *Food Total: ₹${total}*\n\nకస్టమర్ గారూ, దయచేసి మీ లొకేషన్ షేర్ చేయండి!`;

      const encoded = encodeURIComponent(text);
      window.location.href = `https://wa.me/${BOT_PHONE}?text=${encoded}`;
    }

    switchRestaurant('food_palace');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avento Food Services</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-28">

  <!-- Header -->
  <header class="bg-emerald-700 text-white p-4 sticky top-0 z-40 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-utensils"></i> Avento Services
        </h1>
        <p class="text-xs text-emerald-100">Order online & get fast delivery</p>
      </div>
      <span class="bg-emerald-800 text-xs px-2.5 py-1 rounded-full font-medium">
        <i class="fa-solid fa-circle text-emerald-400 text-[10px] mr-1"></i> Open Now
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-3">
    
    <!-- Restaurant Banner / Selector -->
    <div class="bg-white rounded-xl p-3 shadow-sm border border-gray-200 mb-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=120&q=80" alt="Restaurant" class="w-12 h-12 rounded-lg object-cover">
        <div>
          <h2 class="font-bold text-gray-900 text-base">Food Palace Restaurant</h2>
          <p class="text-xs text-gray-500">Hyderabadi, Indian & Chinese</p>
        </div>
      </div>
    </div>

    <!-- Category Filter Bar -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 py-1">
      <button onclick="filterCategory('all')" id="btn-cat-all" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-emerald-700 text-white shadow-sm">All</button>
      <button onclick="filterCategory('Soups')" id="btn-cat-Soups" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-700 border border-gray-300">Soups</button>
      <button onclick="filterCategory('Starters')" id="btn-cat-Starters" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-700 border border-gray-300">Starters</button>
      <button onclick="filterCategory('Biryanis')" id="btn-cat-Biryanis" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-700 border border-gray-300">Biryanis</button>
      <button onclick="filterCategory('Curries')" id="btn-cat-Curries" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-700 border border-gray-300">Curries</button>
      <button onclick="filterCategory('Tandoor')" id="btn-cat-Tandoor" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-700 border border-gray-300">Tandoor</button>
      <button onclick="filterCategory('Desserts')" id="btn-cat-Desserts" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-gray-700 border border-gray-300">Desserts</button>
    </div>

    <!-- Food Items Grid -->
    <div id="food-items-container" class="space-y-3">
      <!-- Dynamic Items Inserted via JavaScript -->
    </div>
  </main>

  <!-- Sticky Bottom Cart Bar -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 shadow-2xl hidden z-50">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-500 font-medium"><span id="cart-count">0</span> items added</p>
        <p class="text-lg font-bold text-emerald-700" id="cart-total">₹0</p>
      </div>
      <button onclick="sendOrderToWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg flex items-center gap-2">
        <i class="fa-brands fa-whatsapp text-lg"></i> Confirm & Order
      </button>
    </div>
  </div>

  <script>
    // WhatsApp Target Number
    const BOT_PHONE = "919059135163";

    // Food Menu Array matching your latest index.js (+₹20 pricing)
    const menuItems = [
      // Soups
      { id: "fp_s1", name: "Veg Hot & Sour Soup", price: 170, category: "Soups", img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_s2", name: "Veg Manchow Soup", price: 170, category: "Soups", img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_s3", name: "Chicken Hot & Sour Soup", price: 190, category: "Soups", img: "https://images.unsplash.com/photo-1603105037880-880cd4edfb0d?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_s4", name: "Chicken Manchow Soup", price: 190, category: "Soups", img: "https://images.unsplash.com/photo-1603105037880-880cd4edfb0d?w=300&auto=format&fit=crop&q=80" },

      // Non-Veg Starters
      { id: "fp_nvs1", name: "Chilli Chicken", price: 275, category: "Starters", img: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_nvs2", name: "Chicken 65", price: 275, category: "Starters", img: "https://images.unsplash.com/photo-1610057099443-fde8c4d50f91?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_nvs3", name: "Chicken Lollipop (Sauce)", price: 295, category: "Starters", img: "https://images.unsplash.com/photo-1527477396000-e27163b481c2?w=300&auto=format&fit=crop&q=80" },

      // Biryanis
      { id: "fp_b1", name: "Chicken Dum Biryani", price: 250, category: "Biryanis", img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_b2", name: "Spl. Chicken Biryani (Boneless)", price: 300, category: "Biryanis", img: "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_b3", name: "Prawns Biryani", price: 330, category: "Biryanis", img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_b7", name: "Mutton Fry Piece Biryani", price: 400, category: "Biryanis", img: "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_b15", name: "Paneer Biryani", price: 260, category: "Biryanis", img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=300&auto=format&fit=crop&q=80" },

      // Curries
      { id: "fp_c13", name: "Butter Chicken", price: 270, category: "Curries", img: "https://images.unsplash.com/photo-1588166524941-3bf61a9c41db?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_vc6", name: "Paneer Butter Masala", price: 330, category: "Curries", img: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=300&auto=format&fit=crop&q=80" },

      // Tandoor
      { id: "fp_t1", name: "Tandoori Roti", price: 75, category: "Tandoor", img: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_t3", name: "Butter Naan", price: 80, category: "Tandoor", img: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_t11", name: "Tandoori Chicken (Full)", price: 489, category: "Tandoor", img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300&auto=format&fit=crop&q=80" },

      // Desserts
      { id: "fp_d1", name: "Vanilla Ice Cream", price: 90, category: "Desserts", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300&auto=format&fit=crop&q=80" },
      { id: "fp_d3", name: "Chocolate Ice Cream", price: 100, category: "Desserts", img: "https://images.unsplash.com/photo-1570197788417-0e82375c9371?w=300&auto=format&fit=crop&q=80" }
    ];

    let cart = {};

    function renderItems(filter = "all") {
      const container = document.getElementById("food-items-container");
      container.innerHTML = "";

      const filtered = filter === "all" ? menuItems : menuItems.filter(i => i.category === filter);

      filtered.forEach(item => {
        const qty = cart[item.id] ? cart[item.id].qty : 0;
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl p-3 shadow-sm border border-gray-100 flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${item.img}" alt="${item.name}" class="w-16 h-16 rounded-lg object-cover">
            <div>
              <h3 class="font-bold text-gray-800 text-sm">${item.name}</h3>
              <p class="text-xs text-gray-500 font-medium">₹${item.price}</p>
            </div>
          </div>
          <div class="flex items-center bg-gray-100 rounded-lg p-1 border border-gray-200">
            ${qty > 0 ? `
              <button onclick="updateQty('${item.id}', -1)" class="w-7 h-7 bg-white text-emerald-700 font-bold rounded-md shadow-sm active:scale-95">-</button>
              <span class="w-7 text-center font-bold text-sm text-gray-800">${qty}</span>
            ` : ''}
            <button onclick="updateQty('${item.id}', 1)" class="w-7 h-7 bg-emerald-600 text-white font-bold rounded-md shadow-sm active:scale-95">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateQty(id, change) {
      const item = menuItems.find(i => i.id === id);
      if (!item) return;

      if (!cart[id]) cart[id] = { name: item.name, price: item.price, qty: 0 };
      cart[id].qty += change;

      if (cart[id].qty <= 0) delete cart[id];

      updateCartBar();
      renderItems(currentFilter);
    }

    let currentFilter = 'all';
    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.replace('bg-emerald-700', 'bg-white');
        btn.classList.replace('text-white', 'text-gray-700');
      });
      const activeBtn = document.getElementById(`btn-cat-${cat}`);
      if (activeBtn) {
        activeBtn.classList.replace('bg-white', 'bg-emerald-700');
        activeBtn.classList.replace('text-gray-700', 'text-white');
      }
      renderItems(cat);
    }

    function updateCartBar() {
      let count = 0;
      let total = 0;

      Object.values(cart).forEach(item => {
        count += item.qty;
        total += item.price * item.qty;
      });

      const bar = document.getElementById("cart-bar");
      if (count > 0) {
        bar.classList.remove("hidden");
        document.getElementById("cart-count").innerText = count;
        document.getElementById("cart-total").innerText = `₹${total}`;
      } else {
        bar.classList.add("hidden");
      }
    }

    function sendOrderToWhatsApp() {
      let text = "🍽️ *New Food Order*\n🏨 Hotel: Food Palace Restaurant\n\n";
      let total = 0;
      let index = 1;

      Object.values(cart).forEach(item => {
        const itemTotal = item.price * item.qty;
        text += `${index}. *${item.name}* x ${item.qty} = ₹${itemTotal}\n`;
        total += itemTotal;
        index++;
      });

      text += `\n--------------------\n💰 *Food Total: ₹${total}*\n\nకస్టమర్ గారూ, దయచేసి మీ లొకేషన్ షేర్ చేయండి!`;

      const encoded = encodeURIComponent(text);
      window.location.href = `https://wa.me/${BOT_PHONE}?text=${encoded}`;
    }

    // Initial Render
    renderItems();
  </script>
</body>
</html>

    </div>

    <!-- Restaurant Selector Cards -->

      <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2.5">Select Restaurant</h2>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="switchRestaurant('food_palace')" id="tab-food_palace" class="p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-orange-500 text-white shadow-md shadow-orange-100">

            <span class="text-[10px] text-gray-400">Special Biryani</span>

        </button>
      </div>
    </div>

    <!-- Category Filter Bar -->
    <div id="category-bar" class="flex gap-2 overflow-x-auto no-scrollbar mb-4 py-1"></div>

    <!-- Food Items List -->
    <div id="food-items-container" class="space-y-3"></div>
  </main>

  <!-- Sticky Bottom Cart Bar -->

    let currentRestaurant = 'food_palace';
    let currentCategory = 'all';
    let searchQuery = '';
    let cart = {};

    function switchRestaurant(resId) {
      currentRestaurant = resId;
      currentCategory = 'all';
      searchQuery = '';
      document.getElementById('search-input').value = '';
      
      document.getElementById('tab-food_palace').className = resId === 'food_palace' 
        ? "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-orange-500 text-white shadow-md shadow-orange-100"
        : "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-white text-gray-700 border border-gray-200 shadow-sm";
      
      document.getElementById('tab-brindavanam').className = resId === 'brindavanam' 
        ? "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-orange-500 text-white shadow-md shadow-orange-100"
        : "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-white text-gray-700 border border-gray-200 shadow-sm";

      renderCategories();
      renderItems();
    }

    function handleSearch(query) {
      searchQuery = query.trim().toLowerCase();
      renderItems();
    }

    function renderCategories() {
      const bar = document.getElementById("category-bar");
      const menu = menus[currentRestaurant];
      
      let html = `<button onclick="filterCategory('all')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${currentCategory === 'all' && !searchQuery ? 'bg-orange-500 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200'}">All</button>`;
      
      menu.categories.forEach(cat => {
        const isActive = currentCategory === cat.id && !searchQuery;
        html += `<button onclick="filterCategory('${cat.id}')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${isActive ? 'bg-orange-500 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200'}">${cat.title}</button>`;
      });

      bar.innerHTML = html;
    }

    function filterCategory(catId) {
      currentCategory = catId;
      searchQuery = '';
      document.getElementById('search-input').value = '';
      renderCategories();
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById("food-items-container");
      container.innerHTML = "";

      const menu = menus[currentRestaurant];
      let itemsList = [];

      if (searchQuery) {
        menu.categories.forEach(cat => {
          cat.items.forEach(item => {
            if (item.name.toLowerCase().includes(searchQuery)) {
              itemsList.push(item);
            }
          });
        });
      } else if (currentCategory === 'all') {
        menu.categories.forEach(cat => itemsList.push(...cat.items));
      } else {
        const cat = menu.categories.find(c => c.id === currentCategory);
        if (cat) itemsList = cat.items;
      }

      if (itemsList.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">No items found</div>`;
        return;
      }

      itemsList.forEach(item => {
        const qty = cart[item.id] ? cart[item.id].qty : 0;
        const card = document.createElement("div");
        card.className = "bg-white rounded-3xl p-4 shadow-sm border border-gray-100 flex items-center justify-between gap-4 transition hover:shadow-md";
        card.innerHTML = `
          <div class="flex items-center gap-4 flex-1">
            <img src="${item.img}" alt="${item.name}" class="w-20 h-20 rounded-2xl object-cover shadow-sm">
            <div class="flex-1">
              <h3 class="font-bold text-gray-900 text-sm leading-snug mb-1">${item.name}</h3>
              <p class="text-sm font-extrabold text-gray-800">₹${item.price}</p>
            </div>
          </div>
          <div class="flex items-center bg-gray-50 rounded-2xl p-1 border border-gray-200 shadow-inner">
            ${qty > 0 ? `
              <button onclick="updateQty('${item.id}', -1)" class="w-8 h-8 bg-white text-orange-500 font-bold rounded-xl shadow-sm active:scale-95 flex items-center justify-center">-</button>
              <span class="w-7 text-center font-bold text-sm text-gray-800">${qty}</span>
            ` : ''}
            <button onclick="updateQty('${item.id}', 1)" class="w-8 h-8 bg-orange-500 text-white font-bold rounded-xl shadow-sm shadow-orange-200 active:scale-95 flex items-center justify-center">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateQty(id, change) {
      const menu = menus[currentRestaurant];
      let foundItem = null;
      menu.categories.forEach(cat => {
        const found = cat.items.find(i => i.id === id);
        if (found) foundItem = found;
      });

      if (!foundItem) return;

      if (!cart[id]) cart[id] = { name: foundItem.name, price: foundItem.price, qty: 0 };
      cart[id].qty += change;

      if (cart[id].qty <= 0) delete cart[id];

      updateCartBar();
      renderItems();
    }

    function updateCartBar() {
      let count = 0;
      let total = 0;

      Object.values(cart).forEach(item => {
        count += item.qty;
        total += item.price * item.qty;
      });

      const bar = document.getElementById("cart-bar");
      if (count > 0) {
        bar.classList.remove("hidden");
        document.getElementById("cart-count").innerText = count;
        document.getElementById("cart-total").innerText = `₹${total}`;
      } else {
        bar.classList.add("hidden");
      }
    }

    function sendOrderToWhatsApp() {
      const hotelName = menus[currentRestaurant].name;
      let text = `New Food Order\nHotel: ${hotelName} (Railway Kodur)\n\n`;
      let total = 0;
      let index = 1;

      Object.values(cart).forEach(item => {
        const itemTotal = item.price * item.qty;
        text += `${index}. ${item.name} x ${item.qty} = ₹${itemTotal}\n`;
        total += itemTotal;
        index++;
      });

      text += `\n--------------------\nFood Total: ₹${total}`;

      const encoded = encodeURIComponent(text);
      window.location.href = `https://wa.me/${BOT_PHONE}?text=${encoded}`;
    }

    switchRestaurant('food_palace');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avento Services - Order Food Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8f9fa; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-36">

  <!-- Swiggy Style Top Header with Back Button -->
  <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-gray-100">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <!-- Back Button -->
        <button onclick="goBack()" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl flex items-center justify-center transition active:scale-95">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 bg-orange-500 rounded-xl flex items-center justify-center text-white font-black shadow-md shadow-orange-100">
            <i class="fa-solid fa-utensils"></i>
          </div>
          <div>
            <h1 class="font-extrabold text-gray-900 text-base leading-tight">Avento Services</h1>
            <p class="text-[11px] text-gray-500 flex items-center gap-1">
              <i class="fa-solid fa-location-dot text-orange-500"></i> Railway Kodur, Tirupati Dist
            </p>
          </div>
        </div>
      </div>
      <div class="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-bold flex items-center gap-1 border border-emerald-100">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Open
      </div>
    </div>
  </header>

  <!-- Main App Container -->
  <main class="max-w-md mx-auto px-4 pt-3">
    
    <!-- Offers / Promo Banner Slider -->
    <div class="mb-4 overflow-x-auto no-scrollbar flex gap-3">
      <div class="min-w-[85%] bg-gradient-to-r from-orange-500 to-amber-500 rounded-2xl p-4 text-white shadow-md flex justify-between items-center">
        <div>
          <span class="bg-white/20 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Avento Special</span>
          <h3 class="text-lg font-black mt-1">Get Fast Delivery</h3>
          <p class="text-xs text-orange-100">Order from top restaurants in Railway Kodur</p>
        </div>
        <i class="fa-solid fa-motorcycle text-4xl text-white/30"></i>
      </div>
      <div class="min-w-[85%] bg-gradient-to-r from-red-500 to-pink-500 rounded-2xl p-4 text-white shadow-md flex justify-between items-center">
        <div>
          <span class="bg-white/20 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Fresh Food</span>
          <h3 class="text-lg font-black mt-1">Delicious Biryanis</h3>
          <p class="text-xs text-red-100">Hot & Authentic taste at your doorstep</p>
        </div>
        <i class="fa-solid fa-bowl-rice text-4xl text-white/30"></i>
      </div>
    </div>

    <!-- Swiggy Style Search Bar -->
    <div class="relative mb-4">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
      <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search for dishes, restaurants..." class="w-full bg-white pl-10 pr-4 py-3 rounded-2xl text-sm border border-gray-200 focus:outline-none focus:border-orange-500 shadow-sm">
    </div>

    <!-- Restaurant Selector Cards -->
    <div class="mb-4">
      <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2.5">Select Restaurant</h2>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="switchRestaurant('food_palace')" id="tab-food_palace" class="p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-orange-500 text-white shadow-md shadow-orange-100">
          <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=100&auto=format&fit=crop&q=80" class="w-10 h-10 rounded-xl object-cover shadow-sm">
          <div class="text-left">
            <p class="text-sm leading-tight font-bold">Food Palace</p>
            <span class="text-[10px] text-orange-100">North Indian, Chinese</span>
          </div>
        </button>
        <button onclick="switchRestaurant('brindavanam')" id="tab-brindavanam" class="p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-white text-gray-700 border border-gray-200 shadow-sm">
          <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9?w=100&auto=format&fit=crop&q=80" class="w-10 h-10 rounded-xl object-cover shadow-sm">
          <div class="text-left">
            <p class="text-sm leading-tight font-bold">Brindavan</p>
            <span class="text-[10px] text-gray-400">Special Biryani</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Category Filter Bar -->
    <div id="category-bar" class="flex gap-2 overflow-x-auto no-scrollbar mb-4 py-1"></div>

    <!-- Food Items List -->
    <div id="food-items-container" class="space-y-3"></div>
  </main>

  <!-- Sticky Floating Cart Bar -->
  <div id="cart-bar" class="fixed bottom-16 left-0 right-0 p-3 z-40 hidden">
    <div class="max-w-md mx-auto bg-gray-900 text-white p-3.5 rounded-2xl shadow-2xl flex items-center justify-between border border-gray-800">
      <div onclick="toggleCartModal()" class="cursor-pointer flex items-center gap-3">
        <div class="w-9 h-9 bg-orange-500 rounded-xl flex items-center justify-center font-bold text-sm">
          <span id="cart-count">0</span>
        </div>
        <div>
          <p class="text-[11px] text-gray-400 font-medium">View Cart Details <i class="fa-solid fa-chevron-up text-[9px]"></i></p>
          <p class="text-base font-extrabold text-orange-400 leading-tight" id="cart-total">₹0</p>
        </div>
      </div>
      <button onclick="sendOrderToWhatsApp()" class="bg-orange-500 hover:bg-orange-600 active:scale-95 transition text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-orange-500/30 flex items-center gap-2">
        <i class="fa-brands fa-whatsapp text-base"></i> Place Order
      </button>
    </div>
  </div>

  <!-- Cart Items Drawer Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col justify-end backdrop-blur-sm">
    <div class="bg-white rounded-t-3xl max-w-md w-full mx-auto p-5 max-h-[75vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-gray-100">
        <h3 class="font-extrabold text-gray-900 text-base">Your Selected Items</h3>
        <button onclick="toggleCartModal()" class="w-8 h-8 bg-gray-100 text-gray-500 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="cart-modal-items" class="overflow-y-auto py-3 space-y-3 flex-1 no-scrollbar"></div>
      <div class="pt-3 border-t border-gray-100 flex justify-between items-center">
        <div>
          <p class="text-xs text-gray-400">Total Amount</p>
          <p class="text-lg font-black text-gray-900" id="cart-modal-total">₹0</p>
        </div>
        <button onclick="sendOrderToWhatsApp()" class="bg-orange-500 text-white px-6 py-3 rounded-2xl text-sm font-bold flex items-center gap-2 shadow-lg shadow-orange-100">
          <i class="fa-brands fa-whatsapp text-lg"></i> Confirm Order
        </button>
      </div>
    </div>
  </div>

  <!-- Swiggy Style Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 py-2 shadow-lg">
    <div class="max-w-md mx-auto grid grid-cols-5 text-center">
      <button onclick="navClick('home')" id="nav-home" class="flex flex-col items-center text-orange-500">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] font-bold mt-1">Avento</span>
      </button>
      <button onclick="navClick('restaurants')" id="nav-restaurants" class="flex flex-col items-center text-gray-400">
        <i class="fa-solid fa-utensils text-lg"></i>
        <span class="text-[10px] font-bold mt-1">Dineout</span>
      </button>
      <button onclick="navClick('instamart')" id="nav-instamart" class="flex flex-col items-center text-gray-400">
        <i class="fa-solid fa-basket-shopping text-lg"></i>
        <span class="text-[10px] font-bold mt-1">Instamart</span>
      </button>
      <button onclick="navClick('offers')" id="nav-offers" class="flex flex-col items-center text-gray-400">
        <i class="fa-solid fa-percent text-lg"></i>
        <span class="text-[10px] font-bold mt-1">Offers</span>
      </button>

        <i class="fa-solid fa-magnifying-glass text-lg"></i>
        <span class="text-[10px] font-bold mt-1">Search</span>
      </button>
    </div>
  </nav>

              { id: "br_m6", name: "🍊 Orange", price: 109, img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300&auto=format&fit=crop&q=80" },
              { id: "br_m7", name: "🍇 Black Current", price: 119, img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300&auto=format&fit=crop&q=80" },
              { id: "br_m8", name: "🔵 Blue Coraco", price: 119, img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300&auto=format&fit=crop&q=80" },
              { id: "br_l1", name: "🥛 Sweet Lassi", price: 109, img: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=300&auto=format&fit=crop&q=80" },
              { id: "br_l2", name: "🥭 Mango Lassi", price: 109, img: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=300&auto=format&fit=crop&q=80" },
              { id: "br_l3", name: "🍓 Strawberry Lassi", price: 119, img: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=300&auto=format&fit=crop&q=80" },
              { id: "br_l4", name: "🍫 Chocolate Lassi", price: 109, img: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=300&auto=format&fit=crop&q=80" },
              { id: "br_l5", name: "🍉 Watermelon Lassi", price: 119, img: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=300&auto=format&fit=crop&q=80" },
              { id: "br_l6", name: "🟢 Pista Lassi", price: 119, img: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?w=300&auto=format&fit=crop&q=80" }
            ]
          }
        ]
      }
    };

    let currentRestaurant = 'food_palace';
    let currentCategory = 'all';
    let searchQuery = '';
    let cart = {};
    let favorites = new Set();

    function goBack() {
      if (searchQuery !== '') {
        searchQuery = '';
        document.getElementById('search-input').value = '';
        renderItems();
      } else if (currentCategory !== 'all') {
        filterCategory('all');
      } else {
        window.history.back();
      }
    }

    function switchRestaurant(resId) {
      currentRestaurant = resId;
      currentCategory = 'all';
      searchQuery = '';
      document.getElementById('search-input').value = '';
      
      document.getElementById('tab-food_palace').className = resId === 'food_palace' 
        ? "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-orange-500 text-white shadow-md shadow-orange-100"
        : "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-white text-gray-700 border border-gray-200 shadow-sm";
      
      document.getElementById('tab-brindavanam').className = resId === 'brindavanam' 
        ? "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-orange-500 text-white shadow-md shadow-orange-100"
        : "p-3 rounded-2xl font-bold text-xs flex items-center gap-3 transition bg-white text-gray-700 border border-gray-200 shadow-sm";

      renderCategories();
      renderItems();
    }

    function handleSearch(query) {
      searchQuery = query.trim().toLowerCase();
      renderItems();
    }

    function focusSearch() {
      const input = document.getElementById('search-input');
      input.focus();
      navClick('search');
    }

    function navClick(target) {
      ['home', 'restaurants', 'instamart', 'offers', 'search'].forEach(id => {
        const btn = document.getElementById(`nav-${id}`);
        if (id === target) {
          btn.className = "flex flex-col items-center text-orange-500";
        } else {
          btn.className = "flex flex-col items-center text-gray-400";
        }
      });

      if (target === 'restaurants' || target === 'home') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function toggleFavorite(id) {
      if (favorites.has(id)) {
        favorites.delete(id);
      } else {
        favorites.add(id);
      }
      renderItems();
    }

    function renderCategories() {
      const bar = document.getElementById("category-bar");
      const menu = menus[currentRestaurant];
      
      let html = `<button onclick="filterCategory('all')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${currentCategory === 'all' && !searchQuery ? 'bg-orange-500 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200'}">All</button>`;
      
      menu.categories.forEach(cat => {
        const isActive = currentCategory === cat.id && !searchQuery;
        html += `<button onclick="filterCategory('${cat.id}')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${isActive ? 'bg-orange-500 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200'}">${cat.title}</button>`;
      });

      bar.innerHTML = html;
    }

    function filterCategory(catId) {
      currentCategory = catId;
      searchQuery = '';
      document.getElementById('search-input').value = '';
      renderCategories();
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById("food-items-container");
      container.innerHTML = "";

      const menu = menus[currentRestaurant];
      let itemsList = [];

      if (searchQuery) {
        menu.categories.forEach(cat => {
          cat.items.forEach(item => {
            if (item.name.toLowerCase().includes(searchQuery)) {
              itemsList.push(item);
            }
          });
        });
      } else if (currentCategory === 'all') {
        menu.categories.forEach(cat => itemsList.push(...cat.items));
      } else {
        const cat = menu.categories.find(c => c.id === currentCategory);
        if (cat) itemsList = cat.items;
      }

      if (itemsList.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">No items found</div>`;
        return;
      }

      itemsList.forEach(item => {
        const qty = cart[item.id] ? cart[item.id].qty : 0;
        const isFav = favorites.has(item.id);
        const card = document.createElement("div");
        card.className = "bg-white rounded-3xl p-4 shadow-sm border border-gray-100 flex items-center justify-between gap-4 transition hover:shadow-md relative overflow-hidden";
        card.innerHTML = `
          <div class="flex items-center gap-4 flex-1">
            <div class="relative">
              <img src="${item.img}" alt="${item.name}" class="w-20 h-20 rounded-2xl object-cover shadow-sm">
              <button onclick="toggleFavorite('${item.id}')" class="absolute -top-1.5 -left-1.5 w-7 h-7 bg-white/90 rounded-full flex items-center justify-center shadow-md">
                <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart text-xs ${isFav ? 'text-red-500' : 'text-gray-400'}"></i>
              </button>
            </div>
            <div class="flex-1">
              ${item.bestseller ? `<span class="bg-amber-100 text-amber-800 text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase">Bestseller</span>` : ''}
              <h3 class="font-bold text-gray-900 text-sm leading-snug mb-1 mt-0.5">${item.name}</h3>
              <p class="text-sm font-extrabold text-gray-800">₹${item.price}</p>
            </div>
          </div>
          <div class="flex items-center bg-gray-50 rounded-2xl p-1 border border-gray-200 shadow-inner">
            ${qty > 0 ? `
              <button onclick="updateQty('${item.id}', -1)" class="w-8 h-8 bg-white text-orange-500 font-bold rounded-xl shadow-sm active:scale-95 flex items-center justify-center">-</button>
              <span class="w-7 text-center font-bold text-sm text-gray-800">${qty}</span>
            ` : ''}
            <button onclick="updateQty('${item.id}', 1)" class="w-8 h-8 bg-orange-500 text-white font-bold rounded-xl shadow-sm shadow-orange-200 active:scale-95 flex items-center justify-center">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateQty(id, change) {
      const menu = menus[currentRestaurant];
      let foundItem = null;
      menu.categories.forEach(cat => {
        const found = cat.items.find(i => i.id === id);
        if (found) foundItem = found;
      });

      if (!foundItem) return;

      if (!cart[id]) cart[id] = { name: foundItem.name, price: foundItem.price, qty: 0 };
      cart[id].qty += change;

      if (cart[id].qty <= 0) delete cart[id];

      updateCartBar();
      renderItems();
      renderCartModalItems();
    }

    function updateCartBar() {
      let count = 0;
      let total = 0;

      Object.values(cart).forEach(item => {
        count += item.qty;
        total += item.price * item.qty;
      });

      const bar = document.getElementById("cart-bar");
      if (count > 0) {
        bar.classList.remove("hidden");
        document.getElementById("cart-count").innerText = count;
        document.getElementById("cart-total").innerText = `₹${total}`;
        document.getElementById("cart-modal-total").innerText = `₹${total}`;
      } else {
        bar.classList.add("hidden");
        document.getElementById("cart-modal").classList.add("hidden");
      }
    }

    function toggleCartModal() {
      const modal = document.getElementById("cart-modal");
      if (modal.classList.contains("hidden")) {
        renderCartModalItems();
        modal.classList.remove("hidden");
      } else {
        modal.classList.add("hidden");
      }
    }

    function renderCartModalItems() {
      const container = document.getElementById("cart-modal-items");
      container.innerHTML = "";
      
      Object.entries(cart).forEach(([id, item]) => {
        const row = document.createElement("div");
        row.className = "flex items-center justify-between p-3 bg-gray-50 rounded-2xl border border-gray-100";
        row.innerHTML = `
          <div>
            <p class="font-bold text-xs text-gray-900">${item.name}</p>
            <p class="text-xs text-gray-500 font-semibold mt-0.5">₹${item.price} x ${item.qty} = ₹${item.price * item.qty}</p>
          </div>
          <div class="flex items-center bg-white rounded-xl p-1 border border-gray-200">
            <button onclick="updateQty('${id}', -1)" class="w-6 h-6 text-orange-500 font-bold flex items-center justify-center">-</button>
            <span class="w-6 text-center font-bold text-xs">${item.qty}</span>
            <button onclick="updateQty('${id}', 1)" class="w-6 h-6 text-orange-500 font-bold flex items-center justify-center">+</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function sendOrderToWhatsApp() {
      const hotelName = menus[currentRestaurant].name;
      let text = `New Food Order\nHotel: ${hotelName} (Railway Kodur)\n\n`;
      let total = 0;
      let index = 1;

      Object.values(cart).forEach(item => {
        const itemTotal = item.price * item.qty;
        text += `${index}. ${item.name} x ${item.qty} = ₹${itemTotal}\n`;
        total += itemTotal;
        index++;
      });

      text += `\n--------------------\nFood Total: ₹${total}`;

      const encoded = encodeURIComponent(text);
      window.location.href = `https://wa.me/${BOT_PHONE}?text=${encoded}`;
    }

    switchRestaurant('food_palace');
  </script>
</body>
</html>
